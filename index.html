<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Calendar</title>

  <style>
    body {
      font-family: sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
    }

    h1 {
      margin-bottom: 10px;
    }

    .calendar {
      max-width: 500px;
      margin: auto;
    }

    .month {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .month button {
      font-size: 20px;
      padding: 5px 15px;
    }

    .week {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
    }

    .day {
      border: 1px solid #ddd;
      min-height: 70px;
      padding: 8px 2px;
      box-sizing: border-box;
      cursor: pointer;
    }

    .day:hover {
      background: #f5f5f5;
    }

    .header {
      font-weight: bold;
      background: #f5f5f5;
      min-height: auto;
      cursor: default;
    }

    .today {
      background: #dff5df;
      font-weight: bold;
    }

    .date-number {
      font-size: 18px;
    }

    .event {
      margin-top: 5px;
      font-size: 12px;
      background: #e8e8ff;
      padding: 3px;
      border-radius: 4px;
      word-break: break-word;
    }
  </style>
</head>

<body>

  <h1>My Calendar</h1>

  <div class="calendar">

    <div class="month">
      <button onclick="changeMonth(-1)">◀</button>
      <h2 id="monthTitle"></h2>
      <button onclick="changeMonth(1)">▶</button>
    </div>

    <!-- 曜日 -->
    <div class="week">
      <div class="day header">日</div>
      <div class="day header">月</div>
      <div class="day header">火</div>
      <div class="day header">水</div>
      <div class="day header">木</div>
      <div class="day header">金</div>
      <div class="day header">土</div>
    </div>

    <!-- 日付 -->
    <div id="calendarDays" class="week"></div>

  </div>

  <script>

    // 現在表示している月
    let currentDate = new Date();

    // 予定を保存する場所
    let events = JSON.parse(localStorage.getItem("myCalendarEvents")) || {};


    // カレンダーを作る
    function createCalendar() {

      const year = currentDate.getFullYear();
      const month = currentDate.getMonth();

      document.getElementById("monthTitle").textContent =
        year + "年 " + (month + 1) + "月";

      const firstDay = new Date(year, month, 1).getDay();
      const lastDate = new Date(year, month + 1, 0).getDate();

      const calendarDays = document.getElementById("calendarDays");

      calendarDays.innerHTML = "";


      // 1日の前の空白
      for (let i = 0; i < firstDay; i++) {

        const empty = document.createElement("div");

        empty.className = "day";

        calendarDays.appendChild(empty);
      }


      // 日付
      for (let day = 1; day <= lastDate; day++) {

        const cell = document.createElement("div");

        cell.className = "day";


        // 今日かどうか
        const today = new Date();

        if (
          day === today.getDate() &&
          month === today.getMonth() &&
          year === today.getFullYear()
        ) {
          cell.classList.add("today");
        }


        // 日付の数字
        const dateNumber = document.createElement("div");

        dateNumber.className = "date-number";

        dateNumber.textContent = day;

        cell.appendChild(dateNumber);


        // この日のID
        const dateKey =
          year + "-" +
          String(month + 1).padStart(2, "0") + "-" +
          String(day).padStart(2, "0");


        // 予定がある場合
        if (events[dateKey]) {

          const event = document.createElement("div");

          event.className = "event";

          event.textContent = events[dateKey];

          cell.appendChild(event);
        }


        // 日付をタップしたとき
        cell.onclick = function() {

          addEvent(dateKey);
        };


        calendarDays.appendChild(cell);
      }
    }


    // 予定を追加
    function addEvent(dateKey) {

      const eventName = prompt(
        dateKey + " の予定を入力してください"
      );


      // キャンセルした場合
      if (eventName === null) {
        return;
      }


      // 空欄の場合
      if (eventName.trim() === "") {
        return;
      }


      // 保存
      events[dateKey] = eventName.trim();

      localStorage.setItem(
        "myCalendarEvents",
        JSON.stringify(events)
      );


      // カレンダーを更新
      createCalendar();
    }


    // 月を変更
    function changeMonth(amount) {

      currentDate.setMonth(
        currentDate.getMonth() + amount
      );

      createCalendar();
    }


    // 最初にカレンダーを作る
    createCalendar();

  </script>

</body>
</html>
